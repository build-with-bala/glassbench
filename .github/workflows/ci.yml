# GlassBench CI — the real gate (replaces the old score.yml stub).
#
# Requires a packaging file (pyproject.toml) at the repo root so `pip install .`
# works — that is provided by the packaging task. numpy is the only runtime
# dependency of the scorer; pytest is the only extra we install here for tests.
#
# Two jobs run on every push / PR.
#
# `ci` (Python — the scorer pipeline):
#   1. fetch oracle    — download the LongMemEval source if a URL secret is set (runs
#                         BEFORE tests so the source-derived tests + determinism gate
#                         can use it; absent source => those simply skip).
#   2. test            — install the package from pyproject and run the test suite.
#   3. determinism gate — rebuild data/glassbench_v0.1.jsonl from the public
#                         LongMemEval oracle and assert it is BYTE-IDENTICAL to the
#                         committed file (the frozen-data contract).
#   4. leaderboard gate — regenerate every artifact the scorer pipeline owns and assert
#                         each is byte-identical to the committed file:
#                           LEADERBOARD.md             scripts/gen_leaderboard.py --check
#                           results/leaderboard.json   scripts/gen_leaderboard.py --json --check
#                           results/item_results.json  scripts/export_results.py --check
#                         Fail-closed: a missing generator or any drift FAILS the build.
#   5. submission scoring (PRs only) — when a PR adds/changes a
#                         submissions/<name>/predictions.json, validate it against the
#                         submission contract (scripts/validate_submission.py), require
#                         its system.md, then score it with the frozen scorer and print
#                         its leaderboard row.
#
# `web` (Node — the public site in web/):
#   1. snapshot gate   — web/data/ (the committed snapshot the site is built from) must
#                         be byte-identical to the scorer pipeline's output, so the site
#                         can never show a number the scorer did not produce.
#   2. unit tests      — vitest (data contracts, in-browser validator parity, ...).
#   3. build           — `next build` (type-checks and statically generates every route).
#
# This workflow only verifies. It never deploys and holds no deploy credentials: the
# live site is deployed by Coolify's own per-app webhook, by design. Do not add deploy
# steps or tokens here.
#
# Notes on the oracle-dependent steps:
#   * The LongMemEval oracle source (data/longmemeval_oracle.json, ~15 MB) is
#     .gitignored and not redistributed here, so CI can only rebuild the data when
#     the source is available. The fetch step runs FIRST; provide the source via the
#     LONGMEMEVAL_ORACLE_URL repo secret (a direct download URL) to make the
#     determinism gate fail-closed and to exercise the source-derived integrity
#     tests. If no source is reachable, those tests SKIP and the determinism gate
#     prints a clear ::warning:: and skips the byte-comparison rather than producing
#     a false red check — but whenever the source IS present, a non-identical rebuild
#     FAILS the build.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only: this workflow never pushes and never deploys. (A future "post results to
# the PR" job would request `pull-requests: write` here.)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: test + determinism + leaderboard
    runs-on: ubuntu-latest
    env:
      # Optional: a direct-download URL for the LongMemEval oracle JSON. Set it as
      # a repo secret to make the determinism gate fail-closed in CI.
      LONGMEMEVAL_ORACLE_URL: ${{ secrets.LONGMEMEVAL_ORACLE_URL }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history so PR steps can diff the changed submissions against base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package (pyproject) + test deps
        run: |
          python -m pip install --upgrade pip
          # Installs glassbench and its declared deps (numpy) from pyproject.toml.
          pip install .
          # pytest is the only thing the tests need beyond the package itself.
          pip install pytest

      # Fetch the oracle BEFORE running tests so the source-derived integrity tests and
      # the determinism gate can both use it when a URL is configured. On a fresh clone
      # with no secret the source is simply absent; the source-derived tests then SKIP
      # (not fail), so the test step is green regardless.
      - name: Fetch LongMemEval oracle source (if a URL is configured)
        id: oracle
        run: |
          set -euo pipefail
          src="data/longmemeval_oracle.json"
          if [ -f "$src" ]; then
            echo "Oracle source already present in the checkout."
            echo "have_source=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${LONGMEMEVAL_ORACLE_URL:-}" ]; then
            echo "Downloading oracle source from LONGMEMEVAL_ORACLE_URL ..."
            mkdir -p data
            curl -fsSL "$LONGMEMEVAL_ORACLE_URL" -o "$src"
            echo "have_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No oracle source and no LONGMEMEVAL_ORACLE_URL secret — the source-derived integrity tests and the data rebuild will be skipped this run (the schema/metric tests still run). Set the secret to exercise them and make the determinism gate fail-closed."
            echo "have_source=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Determinism gate — rebuild data, assert byte-identical
        if: steps.oracle.outputs.have_source == 'true'
        run: |
          set -euo pipefail
          committed="data/glassbench_v0.1.jsonl"
          if [ ! -f "$committed" ]; then
            echo "::error::Committed data file $committed is missing."
            exit 1
          fi
          # Snapshot the committed file, rebuild in place, and compare.
          cp "$committed" /tmp/glassbench_committed.jsonl
          python -m glassbench.build_data
          if cmp -s "$committed" /tmp/glassbench_committed.jsonl; then
            echo "Determinism gate PASSED: rebuilt data is byte-identical to the committed file."
          else
            echo "::error::Rebuilt data/glassbench_v0.1.jsonl differs from the committed file. The data is FROZEN (v0.1) — the builder must reproduce it byte-for-byte."
            diff <(head -c 4000 /tmp/glassbench_committed.jsonl) <(head -c 4000 "$committed") || true
            exit 1
          fi
          # Restore the committed bytes so later steps see the pristine tree.
          cp /tmp/glassbench_committed.jsonl "$committed"

      - name: Leaderboard gate — regenerate every scorer artifact, assert byte-identical
        run: |
          set -euo pipefail
          # The scorer is frozen; these generators only re-score the committed
          # submissions and render them. Each exposes --check, which writes nothing and
          # exits non-zero on any drift from the committed file. Fail-closed: there is
          # no "generator missing => warn and skip" path.
          status=0
          echo "::group::LEADERBOARD.md"
          python scripts/gen_leaderboard.py --check || status=1
          echo "::endgroup::"
          echo "::group::results/leaderboard.json"
          python scripts/gen_leaderboard.py --json --check || status=1
          echo "::endgroup::"
          echo "::group::results/item_results.json"
          python scripts/export_results.py --check || status=1
          echo "::endgroup::"
          if [ "$status" -ne 0 ]; then
            echo "::error::A generated artifact differs from the committed file. Run 'make leaderboard' (then 'make web-data') and commit the result."
            exit 1
          fi
          echo "Leaderboard gate PASSED: LEADERBOARD.md, results/leaderboard.json and results/item_results.json are byte-stable."

      - name: Find changed submissions (PRs only)
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          # predictions.json files added or modified by this PR.
          files="$(git diff --name-only --diff-filter=AM "$base"...HEAD -- 'submissions/*/predictions.json' || true)"
          if [ -z "$files" ]; then
            echo "No changed submissions/*/predictions.json in this PR."
          else
            echo "Changed submissions:"
            echo "$files"
          fi
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate + score changed submissions and print their rows
        if: github.event_name == 'pull_request'
        env:
          # Passed through the environment, never interpolated into the script: the
          # paths come from the PR and must not be able to inject shell.
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          files="$CHANGED_FILES"
          # Treat an all-whitespace value as empty.
          if [ -z "${files//[$'\n\r\t ']/}" ]; then
            echo "Nothing to score."
            exit 0
          fi
          status=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::Scoring $f"
            if [ ! -f "$f" ]; then
              echo "::error::$f was listed as changed but does not exist."
              status=1
              echo "::endgroup::"
              continue
            fi
            dir="$(dirname "$f")"
            name="$(basename "$dir")"
            # The scorer itself is lenient (it clamps confidences and lets the last of
            # a duplicated id win), so the submission CONTRACT is enforced here by the
            # validator: row shape, confidence range, duplicate ids, unknown ids, gold
            # leakage. The EXAMPLE template uses placeholder ids on purpose and is
            # exempt.
            if [ "$name" != "EXAMPLE" ]; then
              if ! python scripts/validate_submission.py "$f"; then
                echo "::error::$f violates the submission contract (see CONTRIBUTING.md)."
                status=1
              fi
              if [ ! -s "$dir/system.md" ]; then
                echo "::error::$dir/system.md is missing or empty — every submission needs one (copy submissions/EXAMPLE/system.md)."
                status=1
              fi
            fi
            # Print the full table including the Glass row; an unreadable file makes
            # the scorer exit non-zero, which fails this step.
            if python -m glassbench.score --predictions "$f"; then
              :
            else
              echo "::error::Scoring failed for $f"
              status=1
            fi
            echo "::endgroup::"
          done <<< "$files"
          exit "$status"

  web:
    name: web — snapshot gate + vitest + next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --ignore-scripts: nothing the site needs runs a dependency lifecycle script, so
      # none are allowed to (supply-chain hygiene).
      - name: Install dependencies (lockfile, no lifecycle scripts)
        run: npm ci --ignore-scripts

      # The site is built from the committed snapshot in web/data/ (the Docker build
      # context is just web/). It must be exactly what the scorer pipeline produced: the
      # `ci` job proves results/*.json are fresh; this proves web/data/ matches them.
      - name: Snapshot gate — web/data/ is byte-identical to the scorer pipeline's output
        run: node scripts/sync-data.mjs --check

      - name: Sync data
        run: node scripts/sync-data.mjs

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
